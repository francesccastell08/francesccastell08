name: Generate contribution snake

# Animated snake of your contribution grid (incl. private org repos via METRICS_TOKEN).
# Output is committed to dist/ and embedded in README.md with light/dark support.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: francesccastell08
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit snake
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/
          git diff --cached --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push
