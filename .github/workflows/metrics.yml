name: Profile metrics (incl. private org contributions)

# Generates SVGs with private + org-aware stats using METRICS_TOKEN.
# Falls back to GITHUB_TOKEN (public-only) if the PAT secret is not set yet,
# so the workflow never fails on first run — it just shows less until you add the PAT.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "metrics/**"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1 — Activity + org-notable contributions (PRs/issues in cloudserviceconsulting)
      - name: Activity overview (org-aware)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: francesccastell08
          filename: metrics/activity.svg
          base: activity, community
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_days: 0
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_self: no
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          config_timezone: Europe/Madrid
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          retries: 1

      # 2 — Languages including private repos (no indepth clone: fast + quota-safe for 108 repos)
      - name: Languages (incl. private)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: francesccastell08
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes, percentage
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          config_timezone: Europe/Madrid
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          retries: 1

      # 3 — Isometric commit calendar (full year, incl. private when PAT is set)
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: francesccastell08
          filename: metrics/calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Madrid
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          retries: 1
